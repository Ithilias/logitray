name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo_version="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$TAG" != "$cargo_version" ]; then
            echo "::error::Tag '$TAG' does not match Cargo.toml version '$cargo_version'"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare release assets
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/logitray.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected binary not found at $exe"
          }
          Copy-Item $exe logitray.exe
          $hash = (Get-FileHash logitray.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  logitray.exe" | Set-Content SHA256SUMS.txt

      - name: Determine release notes range
        id: release_notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if prev_tag=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null); then
            echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"
          else
            echo "prev_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREV_TAG: ${{ steps.release_notes.outputs.prev_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_args=(--title "$TAG" --generate-notes)
          if [ -n "$PREV_TAG" ]; then
            release_args+=(--notes-start-tag "$PREV_TAG")
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" "${release_args[@]}"
          fi
          gh release upload "$TAG" logitray.exe SHA256SUMS.txt --clobber
