[package]
name = "logitray"
version = "0.4.0"
edition = "2021"
repository = "https://github.com/Ithilias/logitray"

[dependencies]
anyhow = "1.0"
dirs = "7.0"
hidapi = { version = "2.6", features = ["windows-native"] }
serde = { version = "1.0", features = ["derive"] }
tao = "0.37"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tray-icon = "0.24"
# Update check only. native-tls means Schannel with the Windows certificate store
# (no rustls); win-system-proxy honours the proxy from Windows Internet Settings.
ureq = { version = "3.4", default-features = false, features = ["native-tls", "win-system-proxy"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.56"
